name: Playwright Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      signup_email_domain:
        description: "Email domain for the @smoke (account-creating) tests"
        required: false
        default: "example.com"

jobs:
  # Runs on every push / PR to main|master. Excludes @smoke, which creates real
  # accounts on business.flip.id.
  regression:
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests (excluding @smoke)
        run: npx playwright test --grep-invert @smoke
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Manual only (Run workflow button). Runs the @smoke happy-path tests, which
  # submit a valid form and create a real Flip for Business account.
  smoke:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      SIGNUP_EMAIL_DOMAIN: ${{ inputs.signup_email_domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests (@smoke only)
        run: npx playwright test --grep @smoke
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 30
